<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joke of the Day</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:0;display:flex;min-height:100vh;align-items:center;justify-content:center;}
    .card{width:min(520px,92vw);background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);}
    h1{margin:0 0 8px;color:#222;}
    p{margin:0 0 16px;color:#555;line-height:1.4;}
    .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
    button,a{padding:12px 14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
    .btn-primary{background:#111;color:#fff;}
    .btn-secondary{background:#e9e9e9;color:#111;}
    .btn-ghost{background:#fff;border:1px solid #ddd;color:#111;}
    .status{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f8f8f8;color:#222;min-height:24px;}
  </style>
</head>
<body>
  <main class="card">
    <a class="btn-ghost" href="index.html">← Home</a>
    <h1 style="margin-top:10px;">Joke of the Day</h1>
    <p>Click the button for a random joke. You can copy it too.</p>

   <div class="row">
  <button class="btn-primary" id="jokeBtn">Tell me a joke</button>
  <button class="btn-secondary" id="answerBtn">Show Answer</button>
  <button class="btn-secondary" id="copyBtn">Copy</button>
  </div>

    <div class="status" id="jokeText">Ready when you are 😄</div>
  </main>

 <script>
  const jokes = [
    { setup: "Why don’t programmers like nature?", punchline: "Too many bugs." },
    { setup: "Why do programmers prefer dark mode?", punchline: "Because light attracts bugs." },
    { setup: "Why do Java developers wear glasses?", punchline: "Because they don’t C#." },
    { setup: "Why was the JavaScript developer sad?", punchline: "Because he didn’t Node how to Express himself." },
    { setup: "Why did the developer go broke?", punchline: "Because they used up all their cache." },
    { setup: "Why did the computer show up at work late?", punchline: "It had a hard drive." },
    { setup: "Why did the function break up with the loop?", punchline: "It felt like it was going nowhere." },
    { setup: "Why don’t programmers like to go outside?", punchline: "The sunlight causes glare on their screens." },
    { setup: "Why did the scarecrow become a successful developer?", punchline: "He was outstanding in his field." },
    { setup: "Why did the computer go to the doctor?", punchline: "Because it caught a virus." },
    { setup: "Why did the keyboard break up with the mouse?", punchline: "It felt like it was being clicked with someone else." },
    { setup: "Why was the math book sad?", punchline: "It had too many problems." },
    { setup: "Why don’t scientists trust atoms?", punchline: "Because they make up everything." },
    { setup: "Why did the cookie go to the doctor?", punchline: "Because it felt crummy." },
    { setup: "Why did the student eat his homework?", punchline: "Because the teacher said it was a piece of cake." },
    { setup: "Why did the computer go to space?", punchline: "To visit the cloud." },
    { setup: "Why did the phone go to therapy?", punchline: "It lost all its contacts." },
    { setup: "Why was the computer cold?", punchline: "It forgot to close its Windows." },
    { setup: "Why did the robot go on vacation?", punchline: "It needed to recharge." },
    { setup: "Why did the server break up with the database?", punchline: "It couldn’t handle the connection." }
  ];

  const jokeText = document.getElementById("jokeText");
  let currentJoke = null;

  document.getElementById("jokeBtn").addEventListener("click", () => {
    currentJoke = jokes[Math.floor(Math.random() * jokes.length)];
    jokeText.textContent = currentJoke.setup;
  });

  document.getElementById("answerBtn").addEventListener("click", () => {
    if (!currentJoke) {
      jokeText.textContent = "Click 'Tell me a joke' first!";
      return;
    }
    jokeText.textContent = currentJoke.punchline;
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(jokeText.textContent);
      const old = jokeText.textContent;
      jokeText.textContent = "✅ Copied!";
      setTimeout(() => jokeText.textContent = old, 800);
    } catch {
      jokeText.textContent = "Copy not supported in this browser.";
    }
  });
</script>
</body>
</html>
