<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joke of the Day</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:0;display:flex;min-height:100vh;align-items:center;justify-content:center;}
    .card{width:min(520px,92vw);background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);}
    h1{margin:0 0 8px;color:#222;}
    p{margin:0 0 16px;color:#555;line-height:1.4;}
    .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
    button,a{padding:12px 14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
    .btn-primary{background:#111;color:#fff;}
    .btn-secondary{background:#e9e9e9;color:#111;}
    .btn-ghost{background:#fff;border:1px solid #ddd;color:#111;}
    .status{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f8f8f8;color:#222;min-height:24px;}
  </style>
</head>
<body>
  <main class="card">
    <a class="btn-ghost" href="index.html">← Home</a>
    <h1 style="margin-top:10px;">Joke of the Day</h1>
    <p>Click the button for a random joke. You can copy it too.</p>

    <div class="row">
      <button class="btn-primary" id="jokeBtn">Tell me a joke</button>
      <button class="btn-secondary" id="copyBtn">Copy</button>
    </div>

    <div class="status" id="jokeText">Ready when you are 😄</div>
  </main>

  <script>
    const jokes = [
      "Why don’t programmers like nature? Too many bugs.",
      "I told my computer I needed a break… it said: 'No problem, I’ll go to sleep.'",
      "Why did the developer go broke? Because they used up all their cache.",
      "Debugging: being the detective in a crime movie where you are also the criminal.",
      "My code works… I have no idea why.",
      "Why do Java developers wear glasses? Because they don’t C#."
    ];

    const jokeText = document.getElementById("jokeText");

    document.getElementById("jokeBtn").addEventListener("click", () => {
      jokeText.textContent = jokes[Math.floor(Math.random() * jokes.length)];
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(jokeText.textContent);
        const old = jokeText.textContent;
        jokeText.textContent = "✅ Copied!";
        setTimeout(() => jokeText.textContent = old, 800);
      } catch {
        jokeText.textContent = "Copy not supported in this browser.";
      }
    });
  </script>
</body>
</html>
