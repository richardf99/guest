<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Did U Know</title>
  <style>
    :root{--bg:#f4f4f4;--card:#fff;--text:#1b1b1b;--muted:#666;--line:#e6e6e6;--btn:#111;--btn2:#e9e9e9;--soft:#fafafa;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);}
    header{background:var(--card);border-bottom:1px solid var(--line);}
    .nav{max-width:900px;margin:0 auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .logo{font-weight:800;}
    .wrap{max-width:900px;margin:0 auto;padding:22px 18px 60px;}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
    h1{margin:0 0 8px;}
    p{margin:0 0 14px;color:var(--muted);line-height:1.5;}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:15px;}
    .btn-primary{background:var(--btn);color:#fff;}
    .btn-ghost{background:#fff;border:1px solid var(--line);color:#111;}
    .box{margin-top:12px;padding:14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);min-height:60px;display:flex;align-items:center;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    a{color:inherit;text-decoration:none;}
  </style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">Did U Know</div>
    <a class="btn btn-ghost" href="index.html">← Home</a>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h1>Fun Facts 🧠</h1>
    <p>Click the button to get a random fact. You can also copy it.</p>

    <div class="row">
      <button class="btn btn-primary" id="factBtn">Give me a fact</button>
      <button class="btn btn-ghost" id="copyBtn">Copy</button>
    </div>

    <div class="box" id="factText">Tap the button for a fun fact.</div>
  </section>
</main>

<script>
  const facts = [
    "Honey never spoils — sealed honey has been found still edible after thousands of years.",
    "Octopuses have three hearts and blue blood.",
    "A day on Venus is longer than a year on Venus.",
    "Bananas are berries, but strawberries aren’t.",
    "The Eiffel Tower can grow about 6 inches taller in the summer due to heat expansion.",
    "Sharks existed before trees."
  ];

  const factText = document.getElementById("factText");

  document.getElementById("factBtn").addEventListener("click", () => {
    const f = facts[Math.floor(Math.random() * facts.length)];
    factText.textContent = f;
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(factText.textContent);
      const old = factText.textContent;
      factText.textContent = "✅ Copied!";
      setTimeout(() => factText.textContent = old, 800);
    } catch {
      factText.textContent = "Copy not supported in this browser.";
    }
  });
</script>
</body>
</html>
