<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess the Number</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:0;
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:min(620px, 92vw);
      background:#fff;
      padding:28px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    h1{ margin:0 0 8px; color:#222; }
    p{ margin:0 0 16px; color:#555; line-height:1.4; }

    .row{
      display:flex;
      gap:10px;
      margin-top:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    input, select{
      flex:1;
      min-width:170px;
      padding:12px 14px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
      outline:none;
      background:#fff;
    }
    button, a.btn-link{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn-primary{ background:#111; color:#fff; }
    .btn-secondary{ background:#e9e9e9; color:#111; }
    .btn-ghost{ background:#fff; color:#111; border:1px solid #ddd; }

    .status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:10px;
      background:#f8f8f8;
      color:#222;
      min-height:24px;
    }
    .meta{
      margin-top:10px;
      color:#666;
      font-size:14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .hint{
      font-weight:bold;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .toggle{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      color:#666;
    }
    .toggle input{ transform:scale(1.1); }
  </style>
</head>
<body>
  <main class="card">
    <div class="topbar">
      <a class="btn-link btn-ghost" href="index.html">← Home</a>
      <label class="toggle" title="Toggle sound effects">
        <input id="soundToggle" type="checkbox" checked>
        Sound
      </label>
    </div>

    <h1>Guess the Number</h1>
    <p>I’m thinking of a number in the selected range. Try to guess it.</p>

    <div class="row">
      <select id="difficulty">
        <option value="easy">Easy (1–50)</option>
        <option value="normal" selected>Normal (1–100)</option>
        <option value="hard">Hard (1–500)</option>
      </select>
      <button class="btn-secondary" id="newGameBtn">New Game</button>
      <button class="btn-ghost" id="hintBtn">Hint</button>
    </div>

    <div class="row">
      <input id="guessInput" type="number" placeholder="Enter a number..." />
      <button class="btn-primary" id="guessBtn">Guess</button>
      <button class="btn-secondary" id="resetBtn">Reset</button>
    </div>

    <div class="status" id="statusText">Starting…</div>

    <div class="meta">
      <div>Attempts: <span id="attempts">0</span></div>
      <div>Hints left: <span id="hintsLeft">0</span></div>
      <div>Best: <span class="hint" id="bestScore">—</span></div>
      <div class="hint" id="rangeHint">Range: —</div>
    </div>
  </main>

  <script>
    const DIFF = {
      easy:   { min: 1, max: 50,  hints: 2 },
      normal: { min: 1, max: 100, hints: 2 },
      hard:   { min: 1, max: 500, hints: 3 },
    };

    let secretNumber;
    let attempts = 0;
    let minRange = 1;
    let maxRange = 100;
    let hintsLeft = 0;
    let gameOver = false;
    let mode = "normal";

    const difficultyEl = document.getElementById("difficulty");
    const guessInput = document.getElementById("guessInput");
    const statusText = document.getElementById("statusText");
    const attemptsText = document.getElementById("attempts");
    const rangeHint = document.getElementById("rangeHint");
    const bestScore = document.getElementById("bestScore");
    const hintsLeftText = document.getElementById("hintsLeft");
    const guessBtn = document.getElementById("guessBtn");
    const resetBtn = document.getElementById("resetBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const hintBtn = document.getElementById("hintBtn");
    const soundToggle = document.getElementById("soundToggle");

    function beep(type){
      if(!soundToggle.checked) return;
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";

        let freq = 440, duration = 0.09;
        if(type === "low") freq = 320;
        if(type === "high") freq = 620;
        if(type === "win"){ freq = 880; duration = 0.14; }
        if(type === "error") freq = 200;
        if(type === "hint") freq = 520;

        o.frequency.value = freq;
        g.gain.value = 0.06;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + duration);
        setTimeout(() => ctx.close(), 200);
      } catch {}
    }

    function bestKey(m){ return `guess_best_${m}`; }
    function getBest(m){
      const v = localStorage.getItem(bestKey(m));
      return v ? Number(v) : null;
    }
    function setBest(m, tries){
      localStorage.setItem(bestKey(m), String(tries));
    }

    function setMessage(msg){ statusText.textContent = msg; }

    function updateUI(){
      attemptsText.textContent = attempts;
      hintsLeftText.textContent = hintsLeft;

      const best = getBest(mode);
      bestScore.textContent = best ? `${best} tries` : "—";

      rangeHint.textContent = `Range: ${minRange}–${maxRange}`;
      guessBtn.disabled = gameOver;
      hintBtn.disabled = gameOver || hintsLeft <= 0;
    }

    function startGame(){
      mode = difficultyEl.value;
      const cfg = DIFF[mode];

      secretNumber = Math.floor(Math.random() * (cfg.max - cfg.min + 1)) + cfg.min;
      attempts = 0;
      minRange = cfg.min;
      maxRange = cfg.max;
      hintsLeft = cfg.hints;
      gameOver = false;

      guessInput.min = cfg.min;
      guessInput.max = cfg.max;
      guessInput.placeholder = `Enter a number (${cfg.min}-${cfg.max})`;

      setMessage("Make your first guess 👀");
      guessInput.value = "";
      guessInput.focus();
      updateUI();
    }

    function handleGuess(){
      if(gameOver) return;

      const guess = Number(guessInput.value);
      const cfg = DIFF[mode];

      if(!guessInput.value){
        beep("error");
        setMessage("Type a number first.");
        return;
      }

      if(guess < cfg.min || guess > cfg.max){
        beep("error");
        setMessage(`Keep it between ${cfg.min} and ${cfg.max}.`);
        return;
      }

      attempts++;
      attemptsText.textContent = attempts;

      if(guess === secretNumber){
        beep("win");
        setMessage(`✅ Correct! The number was ${secretNumber}. You got it in ${attempts} tries.`);
        gameOver = true;

        const best = getBest(mode);
        if(!best || attempts < best){
          setBest(mode, attempts);
        }

        updateUI();
        return;
      }

      if(guess < secretNumber){
        beep("low");
        setMessage("Too low ⬇️ Try again.");
        if(guess >= minRange) minRange = guess + 1;
      } else {
        beep("high");
        setMessage("Too high ⬆️ Try again.");
        if(guess <= maxRange) maxRange = guess - 1;
      }

      rangeHint.textContent = `Range: ${minRange}–${maxRange}`;
      guessInput.value = "";
      guessInput.focus();
      updateUI();
    }

    function giveHint(){
      if(gameOver) return;
      if(hintsLeft <= 0){
        setMessage("No hints left.");
        return;
      }

      hintsLeft--;
      beep("hint");

      const cfg = DIFF[mode];
      const type = Math.random() < 0.5 ? "parity" : "window";

      if(type === "parity"){
        setMessage(`💡 Hint: The number is ${secretNumber % 2 === 0 ? "EVEN" : "ODD"}.`);
      } else {
        const spread = Math.max(6, Math.floor((cfg.max - cfg.min) * 0.08));
        const lo = Math.max(cfg.min, secretNumber - spread);
        const hi = Math.min(cfg.max, secretNumber + spread);
        setMessage(`💡 Hint: The number is between ${lo} and ${hi}.`);
      }

      updateUI();
    }

    // Events
    guessBtn.addEventListener("click", handleGuess);
    guessInput.addEventListener("keydown", (e) => { if(e.key === "Enter") handleGuess(); });
    resetBtn.addEventListener("click", startGame);
    newGameBtn.addEventListener("click", startGame);
    hintBtn.addEventListener("click", giveHint);
    difficultyEl.addEventListener("change", startGame);

    // Auto start
    startGame();
  </script>
</body>
</html>
